<!DOCTYPE html>
<html>
<head>
    <title>전체 주문 내역</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 40px; }
        .container { background: white; max-width: 900px; margin: 0 auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; font-weight: normal; }
        tr:hover { background-color: #f1f1f1; }

        .btn-view { padding: 6px 12px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .btn-new { display: inline-block; margin-bottom: 15px; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; }
        
        /* 삭제 버튼 스타일 */
        .btn-delete { color: #dc3545; text-decoration: none; font-weight: bold; font-size: 14px; padding: 5px 10px; border: 1px solid #dc3545; border-radius: 4px; }
        .btn-delete:hover { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <a href="/" class="btn-new">← 홈으로</a>
            <h2>BOM 변환 내역 (History)</h2>
            <div style="width:100px;"></div> </div>

        <table>
            <thead>
                <tr>
                    <th width="10%">No.</th>
                    <th width="25%">프로젝트명</th>
                    <th width="15%">사원 ID</th>
                    <th width="20%">주문 일시</th>
                    <th width="15%">상세보기</th>
                    <th width="15%">관리</th>
                </tr>
            </thead>
            <tbody>
                {% for q in quotes %}
                <tr>
                    <td>{{ q.quote_id }}</td>
                    <td style="font-weight:bold;">{{ q.project_name }}</td>
                    <td>{{ q.customer_name }}</td>
                    <td>{{ q.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                    <td>
                        <a href="/view_order/{{ q.quote_id }}" class="btn-view">확인하기</a>
                    </td>
                    <td>
                        <a href="/delete_order/{{ q.quote_id }}" 
                           class="btn-delete"
                           onclick="return confirm('⚠️ 경고!\n\n정말 이 주문 내역을 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.');">
                           ❌ 삭제
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>

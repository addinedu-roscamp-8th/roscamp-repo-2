# bridge_for_pinky_1542
name: pinky3_to_main
from_domain: 36
to_domain: 30

topics:
  /arrived_point:
    type: std_msgs/msg/Int32
  
  /battery/present:
    type: std_msgs/msg/Float32
    remap: /pinky3/battery/present
   
  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /pinky3/amcl_pose
    
  /jetcobot/pick_and_place/done:
    type: std_msgs/msg/Bool
    reversed: true

  /pick_and_place/done:
    type: std_msgs/msg/Bool
    reversed: true
    
  /pinky3/load_done:
    type: std_msgs/msg/Bool
    reversed: true
    remap: /load_done

  /pinky3/unload_done:
    type: std_msgs/msg/Bool
    reversed: true
    remap: /unload_done
    
  /pinky3/move_role:
    type: std_msgs/msg/String
    reversed: true
    remap: /move_role

  
